services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: secphils-web-1
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portal-network

  postgres:
    image: postgres:17-alpine
    container_name: secphils-postgres-1
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # NEVER mount db/migration into docker-entrypoint-initdb.d: initdb runs
      # *.sql in ALPHABETICAL order (V1, V10, V11… before V2), so a fresh
      # volume dies on V10 ("relation services does not exist", verified
      # 2026-09-08) and prod's first boot fails. Flyway (spring.flyway) is the
      # sole migration owner — it applies V* in version order at API start.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portal-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: secphils-api-1
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me-in-production-min-32-chars}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-notifications@secphils.com}
      - INVITE_BASE_URL=${INVITE_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - portal-network

  # S3-compatible object storage for message/document attachments. Configured
  # in the app via Admin → Settings → Object Storage (system_settings.storage);
  # the endpoint stored there is http://minio:9000 (in-network hostname).
  # LOCAL-ONLY: excluded from `docker compose up -d` unless you pass
  # `--profile local`. Production (e.g. AWS EC2) should use real AWS S3 —
  # the same app config works with endpoint left empty.
  minio:
    profiles: ["local"]
    image: minio/minio
    container_name: secphils-minio-1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secphils-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secphils-minio-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - portal-network

  # One-shot: wait for MinIO then create the app bucket (idempotent).
  minio-init:
    profiles: ["local"]
    image: minio/mc
    container_name: secphils-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secphils-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secphils-minio-dev-secret}
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/secphils && echo MINIO_BUCKET_READY"
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
