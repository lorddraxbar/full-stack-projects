<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — A. Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bsp: #29ca8e;
    --bsp-hover: #1fa873;
    --bsp-soft: rgba(41, 202, 142, 0.12);
    --ink: #202020;
    --muted: #757575;
    --line: #e8e8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Raleway', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    background: #ffffff;
    line-height: 1.5;
  }
  .section { background: #f9f9f9; padding: 80px 0; }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
  .eyebrow {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bsp);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 3em;
    font-weight: 300;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .lead { color: var(--muted); font-size: 1rem; max-width: 520px; margin-bottom: 28px; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--bsp); color: #fff;
    font-weight: 600; font-size: 0.95rem;
    padding: 14px 26px; border-radius: 999px;
    text-decoration: none;
    transition: background .18s ease, transform .18s ease;
  }
  .cta:hover { background: var(--bsp-hover); transform: translateY(-1px); }
  .cta i { transition: transform .18s ease; }
  .cta:hover i { transform: translateX(3px); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; gap: 40px; } }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 18px;
    padding: 20px 8px;
    border-top: 1px solid var(--line);
    transition: background .18s ease, padding-left .18s ease;
    cursor: pointer;
  }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row:hover { background: rgba(41, 202, 142, 0.06); padding-left: 14px; }
  .row-icon {
    width: 46px; height: 46px; flex: 0 0 46px;
    border-radius: 999px;
    background: var(--bsp-soft);
    display: grid; place-items: center;
    color: var(--bsp);
    font-size: 1.05rem;
  }
  .row-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .row-value { font-size: 1.05rem; font-weight: 600; color: var(--ink); word-break: break-all; }
  .row-value a { color: var(--bsp); text-decoration: none; }
  .row-value a:hover { text-decoration: underline; }
  .chev { margin-left: auto; color: #c9c9c9; font-size: 0.9rem; transition: transform .18s ease, color .18s ease; }
  .row:hover .chev { transform: translateX(4px); color: var(--bsp); }
  .socials { display: flex; gap: 10px; margin-top: 10px; }
  .dot {
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--bsp); font-size: 0.9rem;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .dot:hover { background: var(--bsp); color: #fff; border-color: var(--bsp); transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="section">
    <div class="container">
      <p class="eyebrow" style="margin-bottom:0">Get in touch</p>
      <div class="grid">
        <div>
          <h1>Say hello<br>to us</h1>
          <p class="lead">Questions, quotes, or a compliance checklist you'd like second eyes on — send it over. We read everything and reply within one business day.</p>
          <a class="cta" href="mailto:manager@secphils.com">
            <i class="fa-solid fa-paper-plane"></i>
            Send us a message
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
        <div class="rows">
          <div class="row" onclick="location.href='mailto:manager@secphils.com'">
            <span class="row-icon"><i class="fa-solid fa-envelope"></i></span>
            <div>
              <p class="row-label">Email</p>
              <p class="row-value"><a href="mailto:manager@secphils.com">manager@secphils.com</a></p>
            </div>
            <i class="fa-solid fa-chevron-right chev"></i>
          </div>
          <div class="row" onclick="location.href='tel:+639455105172'">
            <span class="row-icon"><i class="fa-solid fa-phone"></i></span>
            <div>
              <p class="row-label">Phone</p>
              <p class="row-value"><a href="tel:+639455105172">+63 945 510 5172</a></p>
            </div>
            <i class="fa-solid fa-chevron-right chev"></i>
          </div>
          <div class="row">
            <span class="row-icon"><i class="fa-brands fa-facebook-f"></i></span>
            <div>
              <p class="row-label">Follow us</p>
              <div class="socials">
                <a class="dot" href="https://www.facebook.com/strategicengineeringconsultancy/" target="_blank" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a class="dot" href="#" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a class="dot" href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a class="dot" href="#" title="X"><i class="fa-brands fa-x-twitter"></i></a>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right chev"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
