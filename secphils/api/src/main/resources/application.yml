spring:
  application:
    name: secphils-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secphils}
    username: ${DB_USERNAME:secphils}
    password: ${DB_PASSWORD:secphils123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Placeholder values for V34's SMTP seed (lowercase names — Spring relaxed
    # binding lowercases placeholder keys, so camelCase names would miss).
    placeholders:
      smtphost: ${SMTP_HOST:6jeirqic6tzx.uemp.mail-manager-smtp.amazonaws.com}
      smtpport: ${SMTP_PORT:587}
      smtpusername: ${SMTP_USERNAME:}
      smtppassword: ${SMTP_PASSWORD:}
      mailfrom: ${MAIL_FROM:notifications@secphils.com}
  servlet:
    multipart:
      # Document uploads (S3-backed); nginx caps the /api/ proxy at 25m
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${SMTP_HOST:6jeirqic6tzx.uemp.mail-manager-smtp.amazonaws.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:notifications@secphils.com}
    properties:
      mail:
        smtp:
          auth: true
          # AWS SMTP (the default relay) speaks STARTTLS on 587, not implicit
          # SSL. MailService.senderFor() derives ssl-vs-starttls from the port
          # for DB configs; this env fallback mirrors the 587 path. If you ever
          # point SMTP_* at a 465/implicit-SSL relay, flip these two lines.
          ssl:
            enable: false
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Anonymous callers (e.g. the public /api/health probe) see only the
      # overall status; component details (DB URL etc.) require auth.
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Placeholder — real secret + TTL configured in Phase 3 (auth)
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-chars}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  invite:
    # Base URL of the web app used to build invite links
    base-url: ${INVITE_BASE_URL:http://localhost:3000}
    # How long a set-password link stays valid
    token-ttl: 24h

logging:
  level:
    org.hibernate.SQL: warn
    com.secphils: info
