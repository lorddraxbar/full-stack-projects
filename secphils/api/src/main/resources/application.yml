spring:
  application:
    name: secphils-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secphils}
    username: ${DB_USERNAME:secphils}
    password: ${DB_PASSWORD:secphils123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Placeholder — real secret + TTL configured in Phase 3 (auth)
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-chars}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

logging:
  level:
    org.hibernate.SQL: warn
    com.secphils: info
