server {
    listen 80;
    server_name localhost;

    # Re-resolve the api container via Docker's embedded DNS at RUNTIME.
    # A literal `proxy_pass http://api:8080/` resolves once at nginx startup
    # and caches the IP forever: recreating the api container (any rebuild)
    # changes its IP and every proxied call 502s until web restarts too
    # (bit us 2026-09-08). With resolver + a variable upstream, nginx
    # re-resolves every 10s and API restarts are invisible to users.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/vnd.ms-excel image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Proxy API calls to the Spring Boot backend (same docker network).
    # NOTE: with a variable in proxy_pass and no URI part, nginx forwards the
    # ORIGINAL request URI (/api/v1/...), which is exactly what the backend
    # serves — same behaviour as the old `http://api:8080/api/` prefix rewrite.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25m;
    }

    # Backend health probe (public; status only — details require auth)
    location = /api/health {
        # Spring Boot actuator health endpoint. Explicit URI part wins with a
        # variable upstream, so /api/health maps to /actuator/health as before.
        proxy_pass $api_upstream/actuator/health$is_args$args;
    }

    # SPA routing - handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
